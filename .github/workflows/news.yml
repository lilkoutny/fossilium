name: Paläo-News aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"   # jeden Tag um 5:00 UTC (7:00 deutscher Sommerzeit)
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Optionales Limit für einen manuellen Prüflauf; 0 bearbeitet alle"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: fossilium-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests feedparser

      - name: News holen und zusammenfassen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MAX_ARTICLES: ${{ inputs.max_articles || '0' }}
        run: python -u hole_news.py

      - name: Publikationsseiten prüfen
        run: python publikationen/render.py --check

      - name: Veröffentlichungsdaten und Status einchecken
        run: |
          git config user.name "fossilium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json news-archiv.json publikationen/ news-pipeline-state.json
          git diff --cached --quiet || git commit -m "Paläo-News vom $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
